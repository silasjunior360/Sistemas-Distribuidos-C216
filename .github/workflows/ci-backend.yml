name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

# O projeto Python (pyproject.toml, poetry.lock e tests/) fica em backend/
defaults:
  run:
    working-directory: backend

jobs:
  lint-and-format:
    name: Ruff (Lint & Format)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: poetry
          cache-dependency-path: backend/poetry.lock

      - name: Install dependencies
        run: poetry install --with dev --no-root

      - name: Check Formatting
        run: poetry run ruff format --check .

      - name: Lint Code
        run: poetry run ruff check .

  tests:
    name: Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: poetry
          cache-dependency-path: backend/poetry.lock

      - name: Install dependencies
        run: poetry install --with dev --no-root

      - name: Run Tests
        run: poetry run pytest tests -q

  database:
    name: PostgreSQL (Migrations & Integration)
    runs-on: ubuntu-latest

    # Banco de verdade para validar as migrations e a persistência
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
      TEST_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app_test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: poetry
          cache-dependency-path: backend/poetry.lock

      - name: Install dependencies
        run: poetry install --with dev --no-root

      - name: Apply Migrations on an Empty Database
        run: poetry run alembic upgrade head

      - name: Check Models Match Migrations
        run: poetry run alembic check

      - name: Downgrade and Upgrade Again
        run: |
          poetry run alembic downgrade base
          poetry run alembic upgrade head

      - name: Create Test Database
        run: PGPASSWORD=app psql -h localhost -U app -d app -c "CREATE DATABASE app_test"

      - name: Run Integration Tests on PostgreSQL
        run: poetry run pytest tests/integration -q
