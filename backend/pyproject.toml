[project]
name = "sistemas-distribuidos"
version = "0.1.0"
description = "Backend para atividade 1 de Sistemas Distribuídos"
authors = [
    {name = "silasjunior360",email = "silas36junior@gmail.com"}
]
requires-python = ">=3.12"
package-mode = false
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.3,<0.53.0)"
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.16.3,<0.17.0)"
]

[tool.ruff]
# O código da aplicação fica em app/ (imports "from app...")
src = ["."]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
